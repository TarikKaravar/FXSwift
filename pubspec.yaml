name: flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.1
  http: ^1.4.0
  lottie: ^3.3.1
  provider: ^6.1.0
  shared_preferences: ^2.5.3
  fl_chart: ^0.66.0  
  intl: ^0.18.1 
  url_launcher: ^6.1.10
  flutter_gen: ^5.10.0
  google_sign_in: ^6.2.1 
  firebase_core: ^3.13.1
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/LOGO.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/motions/
    - assets/icons/
    - assets/icons/LOGO.png
    - assets/icons/google_logo.png